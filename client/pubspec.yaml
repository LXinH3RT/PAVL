name: pavl_client
description: "PAVL — Play All Videos in Lan，局域网跨设备视频播放器客户端"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  # 播放内核。media_kit 是 libmpv 的 Dart 封装，自带 MKV 解封装、ASS 字幕、
  # 音轨切换与硬解，无需自研 C 内核。
  media_kit: ^1.2.0
  media_kit_video: ^2.0.0
  media_kit_libs_video: ^1.0.5

  # 窗口管理：普通窗口 / 全屏 / 最小尺寸约束，播放页要切全屏。
  window_manager: ^0.4.3

  # 屏幕常亮：播放时阻止系统休眠。
  wakelock_plus: ^1.2.8

  # 字体：MiSans（可变字体），随包分发，不依赖系统字体。
  # 声明与实现见文件末尾的 flutter.fonts 段与 lib/app.dart 的 PavlFonts。

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # 界面字体随包分发。Windows 的系统默认字体族没有中文字形，中文会落到
  # fallback 链上，同一句里的中文与数字因此来自两套字，字面大小与笔画粗细
  # 对不齐；自带一份覆盖 CJK 的字体后中英混排一致。
  #
  # 该文件是可变字体（fvar/gvar，wght 轴 150-700），Flutter 取默认实例，
  # 需要粗体时由引擎合成，因此不按字重拆分成多个 asset。
  # 许可证与来源声明必须随包分发，见 assets/fonts/NOTICE.txt。
  assets:
    - assets/fonts/MiSans-LICENSE.txt
    - assets/fonts/NOTICE.txt

  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSansVF.ttf
